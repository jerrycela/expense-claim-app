<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>請款單辨識系統</title>
    <!-- Inter Font (Notion-style) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
                    },
                    colors: {
                        notion: {
                            bg: '#FFFFFF',
                            surface: '#F7F6F3',
                            hover: '#EFEFEF',
                            border: '#E5E5E5',
                            text: '#37352F',
                            muted: '#9B9A97',
                            blue: '#2383E2',
                            green: '#0F7B6C',
                            red: '#E03E3E',
                            orange: '#D9730D',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
            background: #FFFFFF;
            color: #37352F;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
        }
        .toast {
            padding: 0.625rem 1rem;
            border-radius: 6px;
            box-shadow: 0 0 0 1px rgba(15,15,15,0.05), 0 3px 6px rgba(15,15,15,0.1), 0 9px 24px rgba(15,15,15,0.2);
            animation: toastIn 0.2s ease;
            font-size: 14px;
            font-weight: 500;
            max-width: 360px;
            background: #37352F;
            color: white;
        }
        .toast.success { background: #0F7B6C; }
        .toast.error { background: #E03E3E; }
        .toast.warning { background: #D9730D; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(8px); }
        }

        /* Upload Area */
        .upload-area {
            border: 1.5px dashed #E5E5E5;
            transition: all 0.15s ease;
        }
        .upload-area:hover {
            border-color: #C4C4C4;
            background: #F7F6F3;
        }
        .upload-area.dragover {
            border-color: #2383E2;
            background: rgba(35, 131, 226, 0.04);
        }

        /* Card */
        .notion-card {
            background: white;
            border: 1px solid #E5E5E5;
            border-radius: 8px;
            transition: box-shadow 0.15s ease;
        }
        .notion-card:hover {
            box-shadow: 0 0 0 1px rgba(15,15,15,0.05), 0 2px 4px rgba(15,15,15,0.1);
        }

        /* Button */
        .notion-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 0.875rem;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.15s ease;
            cursor: pointer;
        }
        .notion-btn-primary {
            background: #2383E2;
            color: white;
        }
        .notion-btn-primary:hover:not(:disabled) {
            background: #1B6EC2;
        }
        .notion-btn-primary:disabled {
            background: #C4C4C4;
            cursor: not-allowed;
        }
        .notion-btn-secondary {
            background: #F7F6F3;
            color: #37352F;
            border: 1px solid #E5E5E5;
        }
        .notion-btn-secondary:hover {
            background: #EFEFEF;
        }

        /* Input */
        .notion-input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            font-size: 14px;
            border: 1px solid #E5E5E5;
            border-radius: 6px;
            background: white;
            transition: all 0.15s ease;
        }
        .notion-input:focus {
            outline: none;
            border-color: #2383E2;
            box-shadow: 0 0 0 2px rgba(35, 131, 226, 0.15);
        }
        .notion-input::placeholder {
            color: #9B9A97;
        }

        /* Progress Bar */
        .progress-bar {
            height: 6px;
            background: #E5E5E5;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: #2383E2;
            transition: width 0.3s ease;
        }

        /* Model Toggle */
        .model-btn {
            padding: 0.5rem 0.75rem;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            border: 1px solid transparent;
            background: transparent;
            color: #9B9A97;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .model-btn:hover:not(:disabled) {
            background: #F7F6F3;
            color: #37352F;
        }
        .model-btn.active {
            background: #F7F6F3;
            color: #37352F;
            border-color: #E5E5E5;
        }
        .model-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Results */
        .result-row {
            display: flex;
            padding: 0.375rem 0;
            border-bottom: 1px solid #F0F0F0;
            font-size: 14px;
        }
        .result-row:last-child {
            border-bottom: none;
        }
        .result-label {
            width: 100px;
            flex-shrink: 0;
            color: #9B9A97;
        }
        .result-value {
            flex: 1;
            color: #37352F;
        }

        /* Preview */
        .preview-item {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #E5E5E5;
        }
        .preview-item img {
            width: 100%;
            height: 80px;
            object-fit: cover;
        }
        .preview-item .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            background: rgba(55, 53, 47, 0.8);
            color: white;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        .preview-item:hover .remove-btn {
            opacity: 1;
        }

        /* File Status */
        .file-status-item {
            display: flex;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #F0F0F0;
            font-size: 13px;
        }
        .file-status-item:last-child {
            border-bottom: none;
        }
        .file-status-icon {
            width: 20px;
            height: 20px;
            margin-right: 0.5rem;
            flex-shrink: 0;
        }
        .file-status-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Auth Screen */
        .auth-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            width: 100%;
            max-width: 360px;
            padding: 2rem;
        }

        /* Spinner */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen">
<!-- Toast Container -->
<div id="toastContainer" class="toast-container"></div>

<!-- Auth Screen -->
<div id="authScreen" class="auth-screen">
    <div class="auth-card text-center">
        <div class="mb-6">
            <svg class="w-12 h-12 mx-auto mb-4 text-notion-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <h1 class="text-xl font-semibold text-notion-text">請款單辨識系統</h1>
            <p class="text-sm text-notion-muted mt-1">請輸入訪問碼以繼續</p>
        </div>
        <div class="space-y-3">
            <input type="password" id="accessCodeInput" class="notion-input text-center" placeholder="輸入訪問碼" autocomplete="off">
            <button id="authBtn" class="notion-btn notion-btn-primary w-full">
                <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"/>
                </svg>
                進入系統
            </button>
        </div>
    </div>
</div>

<!-- Main App (Hidden until authenticated) -->
<div id="mainApp" class="hidden">
    <div class="max-w-xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-semibold text-notion-text mb-1">請款單辨識系統</h1>
            <p class="text-notion-muted text-sm">上傳請款單照片，自動提取資訊並存入 Google Sheet</p>
            <p class="text-notion-muted text-xs mt-1">支援批次處理，最多 <span id="maxFilesDisplay">100</span> 張圖片</p>
        </div>

        <!-- Model Selection Card -->
        <div class="notion-card mb-4 p-4">
            <div class="flex items-center justify-between mb-3">
                <span class="text-sm font-medium text-notion-text">選擇 AI 模型</span>
                <button id="logoutBtn" class="text-xs text-notion-muted hover:text-notion-text">登出</button>
            </div>
            <div class="flex gap-1 p-1 bg-notion-surface rounded-lg" id="modelSelector">
                <button data-model="claude" class="model-btn flex-1" disabled>Claude</button>
                <button data-model="openai" class="model-btn flex-1" disabled>OpenAI</button>
                <button data-model="gemini" class="model-btn flex-1" disabled>Gemini</button>
            </div>
        </div>

        <!-- Upload Card -->
        <div class="notion-card mb-4">
            <div class="p-4">
                <div id="dropzone" class="upload-area rounded-lg p-6 text-center cursor-pointer">
                    <input type="file" id="fileinput" accept="image/*" multiple class="hidden">
                    <svg class="w-10 h-10 mx-auto mb-3 text-notion-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <p class="text-sm text-notion-text mb-1">點擊或拖放圖片上傳</p>
                    <p class="text-xs text-notion-muted">支援 JPEG, PNG, GIF, WebP（單檔上限 10MB，總計 100MB）</p>
                </div>

                <div id="preview" class="grid grid-cols-5 gap-2 mt-4 hidden"></div>

                <div id="fileCount" class="text-xs text-notion-muted mt-3 hidden"></div>

                <div id="progressSection" class="mt-4 hidden">
                    <div class="flex justify-between text-sm mb-2">
                        <span id="progressText" class="text-notion-text font-medium">準備中...</span>
                        <span id="progressCount" class="text-notion-muted">0/0</span>
                    </div>
                    <div class="progress-bar mb-3">
                        <div class="fill" id="progressFill" style="width: 0%"></div>
                    </div>
                    <div id="fileStatusList" class="max-h-48 overflow-y-auto border border-notion-border rounded-lg p-2 hidden"></div>
                </div>

                <button id="submitBtn" class="notion-btn notion-btn-primary w-full mt-4 hidden">
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                    </svg>
                    開始辨識
                </button>
            </div>
        </div>

        <!-- Results -->
        <div id="results" class="space-y-3"></div>
    </div>
</div>

<script>
// ============================================================================
// State
// ============================================================================
let accessCode = '';
let model = 'claude';
let availableModels = [];
let maxFiles = 100;
let files = [];
let currentTaskId = null;
let pollInterval = null;
const MAX_FILE_SIZE = 10 * 1024 * 1024;
const MAX_TOTAL_SIZE = 100 * 1024 * 1024;
const POLL_INTERVAL_MS = 1000;

// ============================================================================
// Toast
// ============================================================================
function showToast(message, type = 'info', duration = 3000) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.animation = 'toastOut 0.2s ease forwards';
        setTimeout(() => toast.remove(), 200);
    }, duration);
}

// ============================================================================
// Authentication
// ============================================================================
async function authenticate() {
    const code = document.getElementById('accessCodeInput').value.trim();
    if (!code) {
        showToast('請輸入訪問碼', 'warning');
        return;
    }

    const btn = document.getElementById('authBtn');
    btn.disabled = true;
    btn.innerHTML = '<svg class="w-4 h-4 mr-1.5 spinner" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>驗證中...';

    try {
        const res = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'X-Access-Code': code }
        });
        const data = await res.json();

        if (!res.ok) {
            throw new Error(data.error || '驗證失敗');
        }

        accessCode = code;
        availableModels = data.available_models || [];
        maxFiles = data.max_files || 100;
        localStorage.setItem('accessCode', code);

        document.getElementById('maxFilesDisplay').textContent = maxFiles;
        showMainApp();
        showToast('驗證成功', 'success');
    } catch (e) {
        showToast(e.message || '驗證失敗', 'error');
        localStorage.removeItem('accessCode');
    }

    btn.disabled = false;
    btn.innerHTML = '<svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"/></svg>進入系統';
}

function logout() {
    accessCode = '';
    availableModels = [];
    localStorage.removeItem('accessCode');
    stopPolling();
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('mainApp').classList.add('hidden');
    document.getElementById('accessCodeInput').value = '';
    showToast('已登出', 'success');
}

function showMainApp() {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    setupModelButtons();
}

function setupModelButtons() {
    const buttons = document.querySelectorAll('#modelSelector .model-btn');
    buttons.forEach(btn => {
        const m = btn.dataset.model;
        const isAvailable = availableModels.includes(m);
        btn.disabled = !isAvailable;
        if (isAvailable && !model) {
            model = m;
        }
    });

    if (availableModels.length > 0 && !availableModels.includes(model)) {
        model = availableModels[0];
    }

    updateModelSelection();
}

function updateModelSelection() {
    document.querySelectorAll('#modelSelector .model-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.model === model);
    });
}

// ============================================================================
// Model Selection
// ============================================================================
document.getElementById('modelSelector').addEventListener('click', (e) => {
    const btn = e.target.closest('.model-btn');
    if (btn && !btn.disabled) {
        model = btn.dataset.model;
        updateModelSelection();
    }
});

// ============================================================================
// Auth Event Listeners
// ============================================================================
document.getElementById('authBtn').addEventListener('click', authenticate);
document.getElementById('accessCodeInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') authenticate();
});
document.getElementById('logoutBtn').addEventListener('click', logout);

// ============================================================================
// File Upload
// ============================================================================
const dropzone = document.getElementById('dropzone');
const fileinput = document.getElementById('fileinput');

dropzone.addEventListener('click', () => fileinput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    addFiles(e.dataTransfer.files);
});
fileinput.addEventListener('change', () => addFiles(fileinput.files));

function addFiles(newFiles) {
    const validFiles = [];
    let totalSize = files.reduce((sum, f) => sum + f.size, 0);
    let skipped = 0;

    Array.from(newFiles).forEach(f => {
        if (files.length + validFiles.length >= maxFiles) {
            skipped++;
            return;
        }
        if (!f.type.startsWith('image/')) {
            showToast(`${f.name} 不是圖片檔案`, 'warning');
            return;
        }
        if (f.size > MAX_FILE_SIZE) {
            showToast(`${f.name} 超過 10MB 上限`, 'warning');
            return;
        }
        if (totalSize + f.size > MAX_TOTAL_SIZE) {
            showToast('總檔案大小超過 100MB 上限', 'warning');
            return;
        }
        totalSize += f.size;
        validFiles.push(f);
    });

    files = [...files, ...validFiles];
    renderPreview();

    if (validFiles.length > 0) {
        showToast(`已加入 ${validFiles.length} 個檔案`, 'success');
    }
    if (skipped > 0) {
        showToast(`已達上限 ${maxFiles} 個檔案，${skipped} 個檔案被跳過`, 'warning');
    }
}

function removeFile(index) {
    files.splice(index, 1);
    renderPreview();
}

function clearFiles() {
    files = [];
    renderPreview();
}

function renderPreview() {
    const preview = document.getElementById('preview');
    const submitBtn = document.getElementById('submitBtn');
    const fileCount = document.getElementById('fileCount');

    if (!files.length) {
        preview.classList.add('hidden');
        submitBtn.classList.add('hidden');
        fileCount.classList.add('hidden');
        return;
    }

    preview.classList.remove('hidden');
    submitBtn.classList.remove('hidden');
    fileCount.classList.remove('hidden');

    const totalSize = files.reduce((sum, f) => sum + f.size, 0);
    fileCount.textContent = `已選擇 ${files.length} 個檔案（${(totalSize / 1024 / 1024).toFixed(1)} MB）`;

    preview.innerHTML = '';

    // Only show first 20 previews to avoid performance issues
    const previewCount = Math.min(files.length, 20);
    for (let i = 0; i < previewCount; i++) {
        const f = files[i];
        const idx = i; // Capture index in closure
        const reader = new FileReader();
        reader.onload = e => {
            const div = document.createElement('div');
            div.className = 'preview-item';
            div.dataset.index = idx; // Use data attribute for correct index
            div.innerHTML = `
                <img src="${e.target.result}" alt="${escapeHtml(f.name)}">
                <button class="remove-btn" data-index="${idx}" title="移除">×</button>
            `;
            preview.appendChild(div);
        };
        reader.readAsDataURL(f);
    }

    if (files.length > 20) {
        const more = document.createElement('div');
        more.className = 'preview-item flex items-center justify-center bg-notion-surface text-notion-muted text-xs';
        more.style.height = '80px';
        more.textContent = `+${files.length - 20}`;
        preview.appendChild(more);
    }
}

// Use event delegation for remove buttons (fixes closure index bug)
document.getElementById('preview').addEventListener('click', (e) => {
    const btn = e.target.closest('.remove-btn');
    if (btn) {
        const index = parseInt(btn.dataset.index, 10);
        if (!isNaN(index)) {
            removeFile(index);
        }
    }
});

// ============================================================================
// Task Polling
// ============================================================================
function startPolling(taskId) {
    currentTaskId = taskId;
    localStorage.setItem('currentTaskId', taskId);
    localStorage.setItem('taskStartTime', Date.now().toString());
    pollInterval = setInterval(() => pollTaskStatus(taskId), POLL_INTERVAL_MS);
}

function stopPolling() {
    if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
    }
    currentTaskId = null;
    localStorage.removeItem('currentTaskId');
    localStorage.removeItem('taskStartTime');
}

// Warn user before closing tab during processing
window.addEventListener('beforeunload', (e) => {
    if (currentTaskId && pollInterval) {
        e.preventDefault();
        e.returnValue = '處理中的任務尚未完成，確定要離開嗎？';
        return e.returnValue;
    }
});

async function pollTaskStatus(taskId) {
    try {
        const res = await fetch(`/api/task/${taskId}`, {
            headers: { 'X-Access-Code': accessCode }
        });

        if (!res.ok) {
            if (res.status === 401) {
                stopPolling();
                logout();
                return;
            }
            throw new Error('無法取得任務狀態');
        }

        const task = await res.json();
        updateProgress(task);

        if (task.status === 'completed' || task.status === 'failed') {
            stopPolling();
            onTaskComplete(task);
        }
    } catch (e) {
        console.error('Poll error:', e);
    }
}

function updateProgress(task) {
    const progressText = document.getElementById('progressText');
    const progressCount = document.getElementById('progressCount');
    const progressFill = document.getElementById('progressFill');
    const fileStatusList = document.getElementById('fileStatusList');

    const percent = task.total > 0 ? Math.round((task.processed / task.total) * 100) : 0;
    progressFill.style.width = `${percent}%`;
    progressCount.textContent = `${task.processed}/${task.total}`;

    if (task.status === 'pending') {
        progressText.textContent = '準備中...';
    } else if (task.status === 'processing') {
        progressText.textContent = `處理中... (成功 ${task.successful} / 失敗 ${task.failed})`;
    } else if (task.status === 'completed') {
        progressText.textContent = '完成！';
    } else if (task.status === 'failed') {
        progressText.textContent = '處理失敗';
    }

    // Update file status list
    fileStatusList.classList.remove('hidden');
    fileStatusList.innerHTML = '';

    task.results.forEach(r => {
        const div = document.createElement('div');
        div.className = 'file-status-item';

        let icon = '';
        let statusClass = '';
        if (r.status === 'pending') {
            icon = '<svg class="file-status-icon text-notion-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2" stroke-dasharray="4 4"/></svg>';
            statusClass = 'text-notion-muted';
        } else if (r.status === 'processing') {
            icon = '<svg class="file-status-icon text-notion-blue spinner" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
            statusClass = 'text-notion-blue';
        } else if (r.status === 'success') {
            icon = '<svg class="file-status-icon text-notion-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
            statusClass = 'text-notion-green';
        } else if (r.status === 'failed') {
            icon = '<svg class="file-status-icon text-notion-red" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
            statusClass = 'text-notion-red';
        }

        div.innerHTML = `${icon}<span class="file-status-name ${statusClass}">${escapeHtml(r.filename)}</span>`;
        fileStatusList.appendChild(div);
    });

    // Auto scroll to show processing items
    const processingItem = fileStatusList.querySelector('.text-notion-blue');
    if (processingItem) {
        processingItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
}

function onTaskComplete(task) {
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>開始辨識';

    showResults(task);
    files = [];
    renderPreview();

    if (task.failed > 0) {
        showToast(`完成！成功 ${task.successful} 個，失敗 ${task.failed} 個`, 'warning');
    } else {
        showToast(`成功辨識 ${task.successful} 個檔案`, 'success');
    }

    // Hide progress after delay
    setTimeout(() => {
        document.getElementById('progressSection').classList.add('hidden');
        document.getElementById('fileStatusList').classList.add('hidden');
    }, 3000);
}

// ============================================================================
// Submit
// ============================================================================
document.getElementById('submitBtn').addEventListener('click', submit);

async function submit() {
    if (!files.length) return;

    const submitBtn = document.getElementById('submitBtn');
    const progressSection = document.getElementById('progressSection');
    const progressText = document.getElementById('progressText');
    const progressCount = document.getElementById('progressCount');
    const progressFill = document.getElementById('progressFill');
    const fileStatusList = document.getElementById('fileStatusList');

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<svg class="w-4 h-4 mr-1.5 spinner" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>上傳中...';
    progressSection.classList.remove('hidden');
    fileStatusList.classList.add('hidden');
    progressText.textContent = '上傳中...';
    progressCount.textContent = `0/${files.length}`;
    progressFill.style.width = '0%';

    const fd = new FormData();
    files.forEach(f => fd.append('files', f));

    try {
        const res = await fetch(`/api/process?model=${model}`, {
            method: 'POST',
            headers: { 'X-Access-Code': accessCode },
            body: fd
        });

        const data = await res.json();

        if (!res.ok) {
            if (res.status === 401) {
                logout();
                throw new Error('訪問碼已失效，請重新登入');
            }
            throw new Error(data.error || '處理失敗');
        }

        // Start polling for task status
        showToast(`已開始處理 ${data.total} 個檔案`, 'success');
        startPolling(data.task_id);

    } catch (e) {
        showToast(e.message || '發生錯誤', 'error');
        progressSection.classList.add('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>開始辨識';
    }
}

// ============================================================================
// Results
// ============================================================================
function showResults(data) {
    const resultsContainer = document.getElementById('results');

    const summaryBg = data.failed ? 'bg-orange-50 border-orange-200' : 'bg-green-50 border-green-200';
    const summaryText = data.failed ? 'text-notion-orange' : 'text-notion-green';
    resultsContainer.innerHTML = `
        <div class="notion-card ${summaryBg} border">
            <div class="px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 ${summaryText}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span class="text-sm font-medium text-notion-text">成功 ${data.successful} / 失敗 ${data.failed}</span>
                </div>
                <a href="${data.spreadsheet_url}" target="_blank" class="text-xs text-notion-blue hover:underline flex items-center gap-1">
                    查看 Google Sheet
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                    </svg>
                </a>
            </div>
        </div>
    `;

    data.results.forEach(item => {
        const div = document.createElement('div');
        div.className = 'notion-card';

        if (item.status === 'success') {
            const fields = ['公司別', '申請日期', '表單類別', '申請事項類別', '申請人', '對象', '幣別', '總金額', '主旨', '內容說明'];
            const sheetStatus = item.sheet_saved
                ? '<span class="text-xs text-notion-green flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>已存入</span>'
                : '<span class="text-xs text-notion-orange flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>未儲存</span>';

            div.innerHTML = `
                <div class="px-4 py-3 border-b border-notion-border flex items-center justify-between">
                    <div>
                        <span class="text-sm font-medium text-notion-text">${escapeHtml(item.filename)}</span>
                        <div class="mt-0.5">${sheetStatus}</div>
                    </div>
                    <button class="copy-btn notion-btn notion-btn-secondary text-xs px-2 py-1" title="複製 JSON">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                    </button>
                </div>
                <div class="px-4 py-2">
                    ${fields.map(f => `
                        <div class="result-row">
                            <span class="result-label">${f}</span>
                            <span class="result-value">${escapeHtml(item.data?.[f]) || '—'}</span>
                        </div>
                    `).join('')}
                </div>
            `;

            div.querySelector('.copy-btn').addEventListener('click', () => {
                navigator.clipboard.writeText(JSON.stringify(item.data, null, 2))
                    .then(() => showToast('已複製', 'success'))
                    .catch(() => showToast('複製失敗', 'error'));
            });
        } else {
            div.innerHTML = `
                <div class="px-4 py-3 flex items-center justify-between">
                    <span class="text-sm font-medium text-notion-text">${escapeHtml(item.filename)}</span>
                    <span class="text-notion-red">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </span>
                </div>
                <div class="px-4 pb-3">
                    <p class="text-sm text-notion-red bg-red-50 px-3 py-2 rounded">${escapeHtml(item.error)}</p>
                </div>
            `;
        }

        resultsContainer.appendChild(div);
    });
}

function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    const div = document.createElement('div');
    div.textContent = String(text);
    return div.innerHTML;
}

// ============================================================================
// Initialize - Try auto-login and resume interrupted tasks
// ============================================================================
async function init() {
    const savedCode = localStorage.getItem('accessCode');
    if (savedCode) {
        document.getElementById('accessCodeInput').value = savedCode;
        await authenticate();

        // Check for interrupted task
        const savedTaskId = localStorage.getItem('currentTaskId');
        const taskStartTime = localStorage.getItem('taskStartTime');
        if (savedTaskId && taskStartTime && accessCode) {
            const elapsed = Date.now() - parseInt(taskStartTime);
            // Only try to resume if started within last 30 minutes
            if (elapsed < 30 * 60 * 1000) {
                try {
                    const res = await fetch(`/api/task/${savedTaskId}`, {
                        headers: { 'X-Access-Code': accessCode }
                    });
                    if (res.ok) {
                        const task = await res.json();
                        if (task.status === 'processing' || task.status === 'pending') {
                            showToast('檢測到未完成的任務，正在恢復...', 'info');
                            document.getElementById('progressSection').classList.remove('hidden');
                            startPolling(savedTaskId);
                        } else if (task.status === 'completed' || task.status === 'failed') {
                            showResults(task);
                            showToast('已載入上次的處理結果', 'success');
                            localStorage.removeItem('currentTaskId');
                            localStorage.removeItem('taskStartTime');
                        }
                    } else {
                        // Task not found, clean up
                        localStorage.removeItem('currentTaskId');
                        localStorage.removeItem('taskStartTime');
                    }
                } catch (e) {
                    localStorage.removeItem('currentTaskId');
                    localStorage.removeItem('taskStartTime');
                }
            } else {
                // Task too old, clean up
                localStorage.removeItem('currentTaskId');
                localStorage.removeItem('taskStartTime');
            }
        }
    }
}

init();
</script>
</body>
</html>
